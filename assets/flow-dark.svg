<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 190" width="742" height="190" role="img" aria-labelledby="t d">
<title id="t">Apart, then built</title>
<desc id="d">Thirty-six squares start as one solid block, drift apart into separate pieces, then reassemble as a phone screen and a menu bar panel, on a loop.</desc>
