name: Latest blog posts

on:
  schedule:
    - cron: "17 3 * * *" # daily, 09:02 Nepal time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://www.basantasapkota026.com.np/feeds/posts/default?alt=rss"
          max_post_count: 5
          commit_message: "Update latest blog posts"
